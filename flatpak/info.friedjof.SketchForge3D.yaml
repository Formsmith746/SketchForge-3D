app-id: info.friedjof.SketchForge3D
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: sketchforge
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --allow=devel
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1
  - --env=WEBKIT_FORCE_SANDBOX=0

modules:
  - name: sketchforge
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        PATH: /usr/lib/sdk/node22/bin:/app/bin:/usr/bin
        NO_UPDATE_NOTIFIER: "1"
    build-commands:
      - bash build.sh
    sources:
      - type: dir
        path: ../
      - type: archive
        path: web-out.tar.gz
        dest: apps/web/out
        strip-components: 1
      - type: script
        dest-filename: build.sh
        commands:
          - set -e
          - . /usr/lib/sdk/node22/enable.sh
          - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable
          - export PATH="$HOME/.cargo/bin:$PATH"
          - npm ci
          - echo "=== Frontend check ==="
          - ls apps/web/out/
          - echo "=== Tauri build (production) ==="
          - npx tauri build --no-bundle
          - install -Dm755 src-tauri/target/release/sketchforge /app/bin/sketchforge
          - install -Dm644 flatpak/info.friedjof.SketchForge3D.desktop /app/share/applications/info.friedjof.SketchForge3D.desktop
          - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/info.friedjof.SketchForge3D.png
          - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/info.friedjof.SketchForge3D.png
